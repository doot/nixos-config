[project]
name = "homelab-tools"
version = "0.1.0"
description = "Homelab maintenance tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
jellyfin-people-images = "homelab_tools.jellyfin_people_images:cli"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tests"]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

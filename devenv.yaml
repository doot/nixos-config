# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  devenv-base:
    url: github:doot/devenv-base
    flake: true
  nixpkgs:
    follows: devenv-base/nixpkgs
  git-hooks:
    follows: devenv-base/git-hooks
  pyproject-nix:
    url: github:pyproject-nix/pyproject.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  uv2nix:
    url: github:pyproject-nix/uv2nix
    inputs:
      nixpkgs:
        follows: nixpkgs
      pyproject-nix:
        follows: pyproject-nix
  pyproject-build-systems:
    url: github:pyproject-nix/build-system-pkgs
    inputs:
      nixpkgs:
        follows: nixpkgs
      pyproject-nix:
        follows: pyproject-nix
      uv2nix:
        follows: uv2nix
imports:
  - devenv-base
profile: base

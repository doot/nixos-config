# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  shared-config:
    url: github:doot/devenv-base
    flake: false
    inputs:
      nixpkgs:
        follows: nixpkgs
imports:
- shared-config
profile: base
